name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (CalculiX solver + Qt/gmsh native libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            calculix-ccx \
            libglu1-mesa libgl1 libgomp1 \
            libegl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Run tests (headless)
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -v

  # The CalculiX runtime is not bundled; verify the fetch script is at least
  # syntactically sound on a cross-platform runner (the fetch itself targets
  # Windows, so it is not executed here).
  check-scripts:
    name: Check fetch-ccx.ps1 syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PowerShell
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y powershell
      - name: Parse fetch-ccx.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/fetch-ccx.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "fetch-ccx.ps1: syntax OK"
