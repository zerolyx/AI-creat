[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-fea-valve-gripper"
version = "0.1.0"
description = "Windows desktop finite-element assistant for ball-valve gripper screening."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gmsh>=4.15",
  "PySide6>=6.8",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
